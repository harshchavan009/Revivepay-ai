services:
  # RevivePay AI Autonomous Revenue Engine Backend Service
  - type: web
    name: revivepay-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revivepay-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: DEMO_USER_PASSWORD
        generateValue: true
      - key: RAZORPAY_ENABLED
        value: "false"

# Managed PostgreSQL Database
databases:
  - name: revivepay-postgres
    databaseName: revivepay
    user: revivepay_user
    plan: free
    region: oregon
