name: RevivePay AI CI Suite

on:
  push:
    branches: [ main, launch-polish ]
  pull_request:
    branches: [ main, launch-polish ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Audit Backend Dependencies
        run: |
          pip check

      - name: Train & Validate ML Recovery Model
        run: |
          PYTHONPATH=. python3 ml/train.py
          PYTHONPATH=. python3 ml/evaluate.py

      - name: Run Alembic Database Migrations
        run: |
          PYTHONPATH=. alembic upgrade head

      - name: Run Backend Pytest Suite & Domain Invariant Verifications
        run: |
          PYTHONPATH=. pytest tests/ -v -W ignore

      - name: Run Custom Secrets Hygiene Scanner
        run: |
          python3 scripts/audit_secrets.py

      - name: Run Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Production Artifacts
        run: npm run build
